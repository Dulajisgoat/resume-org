<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumé/CV holder</title>
<script>
(function(){try{var d=document.documentElement,s=window.localStorage;
  if(s.getItem('vanilla-theme')==='light') d.setAttribute('data-theme','light');
  if(s.getItem('vanilla-lite')==='1') d.classList.add('lite');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120D0C;
    --line:rgba(255,255,255,0.12);
    --line-soft:rgba(255,255,255,0.06);
    --ink:#F1E9E1;
    --ink-dim:#B9AC9F;
    --ink-faint:#7E7069;
    --sanguine:#7A2027;
    --sanguine-bright:#B03A3F;
    --sanguine-deep:#4E1519;
    --glass-fill: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.37), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
    --radius-lg: 24px;
    --radius-md: 16px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow:hidden;
  }
  ::selection{ background:var(--sanguine-deep); color:var(--ink); }
  [hidden]{ display:none !important; }

  #webgl-bg{ position:fixed; top:0; left:0; width:100%; height:100%; z-index:-2; }
  .stripes{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(176,58,63,0.03) 40px, rgba(176,58,63,0.03) 41px);
  }
  .side-stripe{
    position:fixed; top:0; left:0; width:4px; height:100%; z-index:50;
    background:linear-gradient(to bottom, var(--sanguine-deep), var(--sanguine-bright), var(--sanguine-deep));
  }

  .glass{
    position:relative; background:var(--glass-fill);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
    border-radius:var(--radius-lg); overflow:hidden;
  }
  .glass::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg, rgba(176,58,63,0.5), rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.1) 60%, rgba(176,58,63,0.3));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; z-index:1;
  }
  .glass::after{
    content:""; position:absolute; top:0; left:20%; right:20%; height:40%;
    background:radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 70%);
    pointer-events:none; z-index:1;
  }

  /* ---------- auth ---------- */
  #auth{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  #auth.leaving{ opacity:0; transform:translateY(-8px); pointer-events:none; }
  .card{ width:100%; max-width:420px; padding:44px 40px 36px; position:relative; }
  .card > *{ position:relative; z-index:2; }
  .kicker{ font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); display:block; margin-bottom:14px; }
  h1{ margin:0; font-weight:300; font-size:44px; line-height:1; letter-spacing:-0.045em; }
  h1 em{ font-style:normal; color:var(--sanguine-bright); font-weight:400; }
  .sub{ margin:14px 0 0; font-size:14px; font-weight:300; color:var(--ink-dim); }

  .tabs{ display:flex; gap:6px; margin:30px 0 22px; padding:5px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--line); position:relative; }
  .tabs button{
    all:unset; flex:1; position:relative; z-index:1; text-align:center; cursor:pointer; padding:9px 0; border-radius:999px;
    font-size:12px; font-weight:500; letter-spacing:0.02em; color:var(--ink-dim); transition:all .25s var(--ease);
  }
  .tabs button:hover{ color:var(--ink); }
  .tabs button.on{ color:#fff; }
  .tabs button:focus-visible{ outline:1px solid var(--sanguine-bright); outline-offset:2px; }

  label.f{ display:block; margin-bottom:16px; }
  label.f span{ display:block; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; font-weight:500; }
  .inp{ position:relative; }
  .inp input{
    width:100%; font:inherit; font-size:15px; font-weight:300; color:var(--ink);
    padding:13px 16px; border-radius:var(--radius-md); background:rgba(255,255,255,0.05);
    border:1px solid var(--line); outline:none; transition:border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .inp input::placeholder{ color:var(--ink-faint); }
  .inp input:focus{ border-color:var(--sanguine-bright); background:rgba(255,255,255,0.07); box-shadow:0 0 0 3px rgba(176,58,63,0.18); }
  .inp input.pw{ padding-right:64px; }
  .inp .eye{
    all:unset; position:absolute; right:8px; top:50%; transform:translateY(-50%); cursor:pointer;
    font-size:11px; font-weight:500; letter-spacing:0.06em; color:var(--ink-faint); padding:6px 10px; border-radius:999px; transition:color .2s var(--ease);
  }
  .inp .eye:hover{ color:var(--ink); }

  .msg{ min-height:20px; margin:2px 0 14px; font-size:13px; font-weight:400; color:var(--ink-faint); }
  .msg.err{ color:#E4797D; }
  .msg.ok{ color:var(--ink-dim); }
  .msg.uname{ margin:6px 0 0; min-height:20px; font-size:12px; }
  .msg.uname.checking{ animation:unamepulse 1.1s var(--ease) infinite; }
  @keyframes unamepulse{ 50%{ opacity:.45; } }
  @media (prefers-reduced-motion:reduce){ .msg.uname.checking{ animation:none; } }

  .go{
    all:unset; box-sizing:border-box; width:100%; text-align:center; cursor:pointer; font-weight:500; font-size:14px; letter-spacing:0.02em; color:#fff;
    padding:14px 18px; border-radius:999px; background:rgba(176,58,63,0.3); border:1px solid var(--sanguine-bright); transition:all .2s var(--ease);
  }
  .go:hover{ background:rgba(176,58,63,0.5); }
  .go:active{ transform:scale(0.98); }
  .go:disabled{ opacity:.55; cursor:default; transform:none; }
  .go:focus-visible{ outline:1px solid #fff; outline-offset:3px; }
  .foot{ margin:22px 0 0; font-size:12px; font-weight:300; color:var(--ink-faint); text-align:center; }

  /* ---------- app ---------- */
  #app{ position:fixed; inset:0; opacity:0; transition:opacity .6s var(--ease); }
  #app.in{ opacity:1; }
  #app iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  .account{
    position:fixed; right:24px; bottom:24px; z-index:200; border-radius:999px;
    display:flex; align-items:center; gap:10px; padding:8px 8px 8px 18px;
  }
  .account > *{ position:relative; z-index:2; }
  .account .who{ font-size:12px; color:var(--ink-dim); letter-spacing:0.02em; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account .role{
    font-size:10px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase; color:var(--sanguine-bright);
  }
  .account button{
    all:unset; cursor:pointer; font-weight:500; font-size:12px; color:var(--ink); padding:10px 16px; border-radius:999px;
    background:rgba(255,255,255,0.08); border:1px solid transparent; transition:all .2s var(--ease);
  }
  .account button:hover{ background:rgba(176,58,63,0.3); border-color:var(--sanguine-bright); color:#fff; }
  .account button:active{ transform:scale(0.96); }
  @media (max-width:640px){ .account .who{ display:none; } .account{ right:16px; bottom:16px; } .card{ padding:36px 26px 30px; } h1{ font-size:38px; } }
  @media print{ .account{ display:none !important; } }

  /* ---------- theme + lower-end device mode ---------- */
  :root{
    --lite-top:#170F0E; --lite-bot:#0E0A09;
    --lite-glow1:rgba(176,58,63,0.34); --lite-glow2:rgba(122,32,39,0.32);
    --lite-edge:rgba(176,58,63,0.16); --lite-sheen:rgba(255,255,255,0.07);
    --lite-card:rgba(26,18,17,0.80);
  }
  html[data-theme="light"]{
    --bg:#F4ECE4;
    --line:rgba(78,21,25,0.14);
    --line-soft:rgba(78,21,25,0.07);
    --ink:#2B1B19;
    --ink-dim:#5C4A45;
    --ink-faint:#75655E;
    --sanguine-bright:#A33339;
    --glass-fill:rgba(255,255,255,0.55);
    --glass-border:rgba(122,32,39,0.16);
    --glass-shadow:0 8px 32px rgba(78,21,25,0.14), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(78,21,25,0.06);
    --lite-top:#F8F2EC; --lite-bot:#EFE5DB;
    --lite-glow1:rgba(176,58,63,0.22); --lite-glow2:rgba(122,32,39,0.15);
    --lite-edge:rgba(163,51,57,0.10); --lite-sheen:rgba(255,255,255,0.85);
    --lite-card:rgba(255,255,255,0.80);
  }
  body{ transition:background-color .35s var(--ease), color .35s var(--ease); }
  .glass{ transition:background-color .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease); }

  html[data-theme="light"] ::selection{ background:rgba(176,58,63,0.25); }
  html[data-theme="light"] .glass::before{
    background:linear-gradient(135deg, rgba(163,51,57,0.45), rgba(122,32,39,0.08) 40%, rgba(122,32,39,0.08) 60%, rgba(163,51,57,0.3));
  }
  html[data-theme="light"] .glass::after{ background:radial-gradient(ellipse at center top, rgba(255,255,255,0.7), transparent 70%); }
  html[data-theme="light"] .tabs{ background:rgba(78,21,25,0.05); }
  html[data-theme="light"] .tabs button.on{ color:var(--sanguine); }
  html[data-theme="light"] .tabs .pill{ background:rgba(176,58,63,0.14); }
  html[data-theme="light"] .inp input{ background:rgba(255,255,255,0.6); }
  html[data-theme="light"] .inp input:focus{ background:rgba(255,255,255,0.92); box-shadow:0 0 0 3px rgba(163,51,57,0.16); }
  html[data-theme="light"] .msg.err{ color:#B3262E; }
  html[data-theme="light"] .go{ background:rgba(163,51,57,0.92); color:#fff; }
  html[data-theme="light"] .go:hover{ background:var(--sanguine); }
  html[data-theme="light"] .go:focus-visible{ outline-color:var(--sanguine); }
  html[data-theme="light"] .account button{ background:rgba(78,21,25,0.06); }
  html[data-theme="light"] .account button:hover{ background:rgba(176,58,63,0.16); color:var(--ink); }

  /* top-right controls */
  .card > .tools{ position:absolute; top:18px; right:18px; z-index:5; display:flex; gap:8px; }
  .tool{
    all:unset; box-sizing:border-box; position:relative; display:grid; place-items:center; width:34px; height:34px; cursor:pointer;
    border-radius:999px; color:var(--ink-dim); background:rgba(255,255,255,0.06); border:1px solid var(--line);
    transition:color .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
  }
  html[data-theme="light"] .tool{ background:rgba(78,21,25,0.05); }
  .tool:hover{ color:var(--ink); border-color:var(--sanguine-bright); }
  .tool:active{ transform:scale(0.94); }
  .tool:focus-visible{ outline:1px solid var(--sanguine-bright); outline-offset:2px; }
  .tool[aria-pressed="true"]{ background:rgba(176,58,63,0.3); border-color:var(--sanguine-bright); color:#fff; }
  html[data-theme="light"] .tool[aria-pressed="true"]{ background:rgba(176,58,63,0.16); color:var(--sanguine); }
  .tool::after{
    content:attr(data-tip); position:absolute; top:calc(100% + 8px); right:0; white-space:nowrap; pointer-events:none;
    font-size:11px; font-weight:500; letter-spacing:0.02em; color:var(--ink); padding:6px 10px; border-radius:999px;
    background:var(--bg); border:1px solid var(--line); opacity:0; transform:translateY(-3px);
    transition:opacity .18s var(--ease), transform .18s var(--ease);
  }
  .tool:focus-visible::after{ opacity:1; transform:none; }
  @media (hover:hover){ .tool:hover::after{ opacity:1; transform:none; } }

  /* CSS-drawn icons */
  .ic{ position:relative; display:block; width:18px; height:18px; }
  .ic i{ position:absolute; inset:0; display:block; transition:opacity .3s var(--ease), transform .4s var(--ease); }
  .ic-sun::before{ content:""; position:absolute; inset:5px; border-radius:50%; background:currentColor; }
  .ic-sun::after{
    content:""; position:absolute; inset:0;
    background:repeating-conic-gradient(from -7deg, currentColor 0 14deg, transparent 14deg 45deg);
    -webkit-mask:radial-gradient(circle, transparent 6.5px, #000 7px, #000 9px, transparent 9.5px);
            mask:radial-gradient(circle, transparent 6.5px, #000 7px, #000 9px, transparent 9.5px);
  }
  .ic-moon::before{ content:""; position:absolute; inset:2px; border-radius:50%; box-shadow:inset -5px -3px 0 0 currentColor; transform:rotate(-20deg); }
  html:not([data-theme="light"]) .ic-moon{ opacity:0; transform:rotate(-70deg) scale(.5); }
  html[data-theme="light"] .ic-sun{ opacity:0; transform:rotate(70deg) scale(.5); }
  .ic .ic-bolt{ inset:1px; background:currentColor; clip-path:polygon(60% 0%, 18% 56%, 46% 56%, 38% 100%, 82% 42%, 54% 42%); }

  /* lower-end device mode: no WebGL, no backdrop blur, static glossy side panels */
  #lite-bg{ position:fixed; inset:0; z-index:-2; display:none; pointer-events:none; overflow:hidden;
    background:
      radial-gradient(55% 70% at 0% 35%, var(--lite-glow1), transparent 70%),
      radial-gradient(50% 65% at 100% 70%, var(--lite-glow2), transparent 70%),
      linear-gradient(180deg, var(--lite-top), var(--lite-bot));
  }
  #lite-bg::before, #lite-bg::after{
    content:""; position:absolute; top:-10%; bottom:-10%; width:clamp(90px, 22vw, 320px);
  }
  #lite-bg::before{
    left:0;
    -webkit-mask-image:linear-gradient(to right, #000 35%, transparent);
            mask-image:linear-gradient(to right, #000 35%, transparent);
    background:
      linear-gradient(105deg, transparent 8%, var(--lite-sheen) 26%, transparent 46%),
      linear-gradient(to right, var(--lite-edge), transparent);
  }
  #lite-bg::after{
    right:0;
    -webkit-mask-image:linear-gradient(to left, #000 35%, transparent);
            mask-image:linear-gradient(to left, #000 35%, transparent);
    background:
      linear-gradient(255deg, transparent 8%, var(--lite-sheen) 26%, transparent 46%),
      linear-gradient(to left, var(--lite-edge), transparent);
  }
  html.lite #lite-bg{ display:block; }
  html.lite #webgl-bg, html.lite .stripes{ display:none; }
  html.lite .glass{ -webkit-backdrop-filter:none; backdrop-filter:none; background:var(--lite-card); }
  @media (prefers-reduced-motion:reduce){ .ic i, .tool, .tool::after{ transition:none; } }
  /* ---------- motion ---------- */
  .tabs .pill{
    position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 16px) / 2); border-radius:999px; pointer-events:none;
    background:rgba(176,58,63,0.3); box-shadow:inset 0 0 0 1px var(--sanguine-bright);
    transition:transform .55s cubic-bezier(.34,1.32,.64,1), background-color .35s var(--ease);
  }
  .tabs.up .pill{ transform:translateX(calc(100% + 6px)); }
  .tabs button{ transition:color .3s var(--ease); }

  .reveal{
    display:grid; grid-template-rows:0fr; opacity:0; visibility:hidden;
    transition:grid-template-rows .5s var(--ease), opacity .25s var(--ease), visibility 0s linear .5s;
  }
  .reveal.open{
    grid-template-rows:1fr; opacity:1; visibility:visible;
    transition:grid-template-rows .5s var(--ease), opacity .4s var(--ease) .1s, visibility 0s;
  }
  .reveal > div{ min-height:0; overflow:hidden; padding:4px; margin:-4px; }

  @keyframes rise{ from{ opacity:0; transform:translateY(12px); } }
  .card{ animation:rise .7s var(--ease) both; }
  .card > :not(.tools){ animation:rise .6s var(--ease) both; }
  .card > :nth-child(2){ animation-delay:.10s; }
  .card > :nth-child(3){ animation-delay:.16s; }
  .card > :nth-child(4){ animation-delay:.22s; }
  .card > :nth-child(5){ animation-delay:.28s; }
  .card > :nth-child(6){ animation-delay:.34s; }
  .card > :nth-child(7){ animation-delay:.40s; }
  @media (prefers-reduced-motion:reduce){
    .card, .card > :not(.tools){ animation:none; }
    .tabs .pill, .tabs button, .reveal, .reveal.open{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="webgl-bg"></canvas>
<div id="lite-bg"></div>
<div class="stripes"></div>
<div class="side-stripe"></div>

<section id="auth" hidden>
  <div class="card glass">
    <div class="tools">
      <button type="button" class="tool" id="theme-toggle" data-tip="Switch to light mode" aria-label="Switch to light mode">
        <span class="ic"><i class="ic-sun"></i><i class="ic-moon"></i></span>
      </button>
      <button type="button" class="tool" id="lite-toggle" data-tip="Lower-end device mode: Off" aria-label="Lower-end device mode" aria-pressed="false">
        <span class="ic"><i class="ic-bolt"></i></span>
      </button>
    </div>
    <span class="kicker">Résumé</span>
    <h1>Resumé/CV <em>holder</em></h1>
    <p class="sub" id="sub">Sign in to continue.</p>

    <div class="tabs" role="tablist">
      <span class="pill" aria-hidden="true"></span>
      <button type="button" role="tab" id="tab-in" class="on" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-up" aria-selected="false">Create account</button>
    </div>

    <form id="form" novalidate>
      <label class="f"><span>Username</span>
        <div class="inp"><input id="email" type="text" autocomplete="username" placeholder="yourname" required></div>
        <div class="reveal" id="uname-reveal"><div><div class="msg uname" id="uname-status" role="status" aria-live="polite"></div></div></div>
      </label>
      <label class="f"><span>Password</span>
        <div class="inp"><input id="pass" class="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="eye" id="eye" aria-label="Show password">Show</button></div>
      </label>
      <div class="reveal" id="confirm-reveal"><div>
        <label class="f" id="confirm-wrap"><span>Confirm password</span>
          <div class="inp"><input id="pass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>
        </label>
      </div></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button class="go" id="go" type="submit">Sign in</button>
    </form>
    <p class="foot" id="foot">New here? Create an account to view the résumé.</p>
  </div>
</section>

<div id="app" hidden>
  <iframe id="frame" title="Résumé"></iframe>
  <div class="account glass">
    <span class="who" id="who"></span>
    <span class="role" id="role"></span>
    <button type="button" id="out">Sign out</button>
  </div>
</div>

<script type="text/template" id="tpl-admin">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résumé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120D0C;
    --line:rgba(255,255,255,0.12);
    --line-soft:rgba(255,255,255,0.06);
    --ink:#F1E9E1;
    --ink-dim:#B9AC9F;
    --ink-faint:#7E7069;
    --sanguine:#7A2027;
    --sanguine-bright:#B03A3F;
    --sanguine-deep:#4E1519;
    --glass-fill: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.37), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
    --radius-lg: 24px;
    --radius-md: 16px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x: hidden;
  }

  ::selection{ background:var(--sanguine-deep); color:var(--ink); }
  h1,h2,h3{ font-family:inherit; font-weight:500; letter-spacing:-0.03em; margin:0; color:var(--ink); }
  a{ color:inherit; }

  #webgl-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
  }

  .stripes {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(176, 58, 63, 0.03) 40px,
      rgba(176, 58, 63, 0.03) 41px
    );
  }

  .side-stripe {
    position: fixed;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(to bottom, var(--sanguine-deep), var(--sanguine-bright), var(--sanguine-deep));
    z-index: 50;
  }

  .glass{
    position:relative;
    background:var(--glass-fill);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 1;
  }

  .glass::after {
    content: "";
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 40%;
    background: radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 48px; position:relative; }
  @media (max-width:860px){ .wrap{ padding:0 24px; } }

  .rail{
    position:fixed; top:50%; left:22px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:20px 11px; border-radius:999px; z-index:60;
  }
  .rail button{
    all:unset; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.25);
    cursor:pointer; transition:all .3s var(--ease);
  }
  .rail button:hover{ background:var(--ink-dim); transform: scale(1.4); }
  .rail button.active{ background:var(--sanguine-bright); transform:scale(2.2); box-shadow: 0 0 12px var(--sanguine-bright); }
  @media (max-width:860px){ .rail{ display:none; } }

  .toolbar{
    position:fixed; top:24px; right:24px; z-index:60; border-radius:999px;
    display:flex; align-items:center; gap:6px; padding:8px 8px 8px 16px;
  }
  .toolbar span.hint{ font-size:12px; color:var(--ink-dim); margin-right:6px; white-space:nowrap; letter-spacing:0.02em; font-weight: 400; }
  .toolbar button{
    all:unset; cursor:pointer; font-family:inherit; font-weight:500; font-size:12px; color:var(--ink);
    padding:10px 16px; border-radius:999px; background:rgba(255,255,255,0.08); border:1px solid transparent;
    transition:all .2s var(--ease);
  }
  .toolbar button:hover{ background:rgba(176, 58, 63, 0.3); border-color:var(--sanguine-bright); color: #fff; }
  .toolbar button:active{ transform:scale(0.96); }
  @media (max-width:640px){ .toolbar span.hint{ display:none; } }

  main{ padding-left:58px; }
  @media (max-width:860px){ main{ padding-left:0; } }

  section{ padding:120px 0; border-bottom:1px solid var(--line-soft); position: relative; }
  section:last-of-type{ border-bottom:none; }
  @media (max-width:860px){ section{ padding:76px 0; } }

  .kicker{ font-family:inherit; font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); margin-bottom:14px; display:block; }
  .section-hint{ font-size:14px; color:var(--ink-faint); max-width:52ch; margin-bottom:48px; font-weight:300; }

  [contenteditable="true"]{ border-radius:7px; outline-offset:4px; transition:background .2s ease; cursor:text; }

  [contenteditable="true"]:focus{ outline:1px dashed var(--sanguine-bright); background:rgba(176,58,63,0.1); }

  #hero{ min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding:150px 0 100px; }

  .hero-card{ padding:56px clamp(28px,5vw,64px); }

  .hero-card::before {
    padding: 2px;
    background: linear-gradient(135deg, rgba(176,58,63,0.5), rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.1) 60%, rgba(176,58,63,0.3));
  }

  .hero-top{ display:flex; align-items:center; gap:26px; margin-bottom:38px; flex-wrap:wrap; position: relative; z-index: 2; }

  .avatar-upload{

  }
  .avatar-upload:hover{ border-color:var(--sanguine-bright); background:rgba(176,58,63,0.15); box-shadow: 0 0 20px rgba(176,58,63,0.2); }
  .avatar-upload img{ width:100%; height:100%; object-fit:cover; display:none; }
  .avatar-upload.has-photo img{ display:block; }
  .avatar-upload.has-photo .avatar-plus{ display:none; }
  .avatar-plus{ font-size:10px; font-weight:400; letter-spacing:0.1em; color:var(--ink-faint); text-align:center; line-height:1.3; padding:0 8px; text-transform: uppercase; }

  .eyebrow-line{ display:flex; align-items:center; gap:14px; color:var(--ink-dim); font-size:13px; font-weight:300; letter-spacing: 0.05em; }
  .eyebrow-line .rule{ width:34px; height:1px; background:var(--sanguine); }
  .eyebrow-line [contenteditable]{ min-width:160px; }

  .hero-name{ font-weight:300; font-size:clamp(48px, 7.5vw, 96px); line-height:0.98; letter-spacing:-0.045em; max-width:900px; position: relative; z-index: 2; }
  .hero-name [contenteditable]{ display:inline-block; min-width:1ch; }
  .hero-name em{ font-style:normal; color:var(--sanguine-bright); font-weight: 400; }

  .hero-role{ margin-top:24px; font-size:clamp(16px, 1.6vw, 19px); color:var(--ink-dim); max-width:560px; font-weight:300; min-height:1.6em; letter-spacing:-0.01em; position: relative; z-index: 2; }

  .hero-meta{ margin-top:44px; display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--ink-faint); align-items:center; position: relative; z-index: 2; }
  .meta-pill{ padding:9px 14px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--line); min-width:70px; font-weight:400; transition: all .2s ease; }
  .meta-pill:hover { border-color: var(--sanguine-bright); color: var(--ink); }

  .cv-upload{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; padding:9px 16px 9px 12px;
    border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--line);
    font-size:12px; font-weight:400; color:var(--ink-dim); transition:all .2s var(--ease);
  }
  .cv-upload:hover{ border-color:var(--sanguine-bright); background:rgba(176,58,63,0.15); color: var(--ink); }
  .cv-upload.filled{ border-color:var(--glass-border); }
  .cv-upload svg{ width:14px; height:14px; flex:none; opacity:.85; }
  .cv-remove{ all:unset; cursor:pointer; color:var(--ink-faint); font-size:14px; padding:0 2px; }
  .cv-remove:hover{ color:var(--sanguine-bright); }

  .two-col{ display:grid; grid-template-columns:0.85fr 1.15fr; gap:80px; }
  @media (max-width:860px){ .two-col{ grid-template-columns:1fr; gap:32px; } }
  .lede{ font-family:inherit; font-weight:300; font-size:26px; letter-spacing:-0.02em; line-height:1.45; max-width:36ch; min-height:1.6em; }
  .body-copy{ color:var(--ink-dim); font-size:15px; max-width:56ch; font-weight: 300; }
  .body-copy [contenteditable]{ display:block; min-height:1.6em; }
  .body-copy [contenteditable] + [contenteditable]{ margin-top:18px; }

  .ed-list{ display:flex; flex-direction:column; }
  .ed-item{ display:grid; grid-template-columns:150px 1fr; gap:32px; padding:28px 0; border-top:1px solid var(--line-soft); transition: padding-left .3s var(--ease); }
  .ed-item:hover { padding-left: 8px; }
  .ed-list .ed-item:last-child{ border-bottom:1px solid var(--line-soft); }
  @media (max-width:640px){ .ed-item{ grid-template-columns:1fr; gap:8px; } }
  .ed-years{ color:var(--sanguine-bright); font-size:11px; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; padding-top:3px; min-height:1.4em; }
  .ed-degree{ font-size:18px; font-weight:500; letter-spacing:-0.01em; margin-bottom:6px; min-height:1.4em; }
  .ed-school{ color:var(--ink-dim); font-size:14px; font-weight:300; min-height:1.4em; }

  .philosophy-quote{
    font-family:inherit; font-weight:300; font-style:normal; font-size:clamp(24px, 2.8vw, 32px);
    letter-spacing:-0.02em; line-height:1.4; max-width:26ch; border-left:1px solid var(--sanguine); padding-left:32px; min-height:1.6em;
  }

  .values-panel{ margin-top:8px; }
  .values-grid{ display:grid; grid-template-columns:repeat(3, 1fr); }
  @media (max-width:860px){ .values-grid{ grid-template-columns:1fr; } }
  .value-card{ padding:38px 32px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); transition: background .3s var(--ease); }
  .value-card:hover { background: rgba(255,255,255,0.02); }
  .values-grid .value-card:nth-child(3n){ border-right:none; }
  .values-grid .value-card:nth-last-child(-n+3){ border-bottom:none; }
  @media (max-width:860px){ .value-card { border-right: none !important; } .values-grid .value-card:last-child { border-bottom: none; } }

  .value-mark{ width:30px; height:1px; background:var(--sanguine-bright); margin-bottom:20px; }
  .value-title{ font-weight:500; font-size:17px; letter-spacing:-0.01em; margin-bottom:10px; min-height:1.4em; }
  .value-text{ color:var(--ink-dim); font-size:13.5px; font-weight:300; min-height:1.4em; }

  .timeline{ position:relative; margin-top:10px; }
  .timeline::before{ content:""; position:absolute; left:29px; top:8px; bottom:8px; width:1px; background:linear-gradient(to bottom, transparent, var(--sanguine) 10%, var(--line) 50%, transparent); }
  .tl-item{ position:relative; padding-left:76px; padding-bottom:60px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-node{ position:absolute; left:20px; top:2px; width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .tl-node::after{ content:""; width:7px; height:7px; border-radius:50%; background:var(--sanguine-bright); box-shadow: 0 0 8px var(--sanguine-bright); }
  .tl-period{ color:var(--sanguine-bright); font-weight:500; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; margin-bottom:8px; min-height:1.3em; }
  .tl-role{ font-weight:500; font-size:22px; letter-spacing:-0.02em; margin-bottom:4px; min-height:1.3em; }
  .tl-org{ color:var(--ink-dim); font-size:14px; font-weight:300; margin-bottom:14px; min-height:1.3em; }
  .tl-desc{ color:var(--ink-dim); font-size:14.5px; font-weight:300; max-width:58ch; min-height:1.6em; }

  .skill-groups{ display:grid; grid-template-columns:repeat(2, 1fr); gap:44px 60px; }
  @media (max-width:640px){ .skill-groups{ grid-template-columns:1fr; } }
  .skill-group-title{ font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); margin-bottom:18px; min-height:1.3em; }
  .skill-tags{ display:flex; flex-wrap:wrap; gap:9px; }
  .skill-tag{ padding:8px 14px; font-size:12.5px; font-weight:400; color:var(--ink-dim); border-radius:999px; background:rgba(255,255,255,0.03); border:1px solid var(--line); min-width:56px; transition: all .2s var(--ease); }
  .skill-tag:hover { border-color: var(--sanguine-bright); color: var(--ink); background: rgba(176, 58, 63, 0.1); }

  .flat-list{ display:flex; flex-direction:column; }
  .flat-item{ display:grid; grid-template-columns:1fr auto; gap:20px; align-items:baseline; padding:22px 0; border-top:1px solid var(--line-soft); transition: padding-left .3s var(--ease); }
  .flat-item:hover { padding-left: 8px; }
  .flat-list .flat-item:last-child{ border-bottom:1px solid var(--line-soft); }
  .flat-title{ font-weight:500; font-size:16px; letter-spacing:-0.01em; min-height:1.3em; }
  .flat-sub{ color:var(--ink-dim); font-size:13.5px; font-weight:300; margin-top:4px; min-height:1.3em; }
  .flat-year{ color:var(--ink-faint); font-size:12px; font-weight:400; white-space:nowrap; min-height:1.3em; }

  .cert-panel{ margin-top:8px; }
  .cert-grid{ display:grid; grid-template-columns:repeat(2, 1fr); }
  @media (max-width:640px){ .cert-grid{ grid-template-columns:1fr; } }
  .cert-item{ padding:28px 32px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); position: relative; z-index: 2; transition: background .3s var(--ease); }
  .cert-item:hover { background: rgba(255,255,255,0.02); }
  .cert-grid .cert-item:nth-child(2n){ border-right:none; }
  .cert-grid .cert-item:nth-last-child(-n+2){ border-bottom:none; }
  @media (max-width:640px){ .cert-item { border-right: none !important; } .cert-grid .cert-item:last-child { border-bottom: none; } }

  .cert-name{ font-size:15px; font-weight:500; margin-bottom:5px; min-height:1.4em; }
  .cert-meta{ font-size:12px; color:var(--ink-faint); font-weight:300; margin-bottom:12px; min-height:1.4em; }
  .cert-attach{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:11px; font-weight:400; color:var(--ink-faint); padding:6px 12px; border-radius:999px; border:1px solid var(--line); transition:all .2s var(--ease); text-transform: uppercase; letter-spacing: 0.05em; }
  .cert-attach:hover{ border-color:var(--sanguine-bright); color:var(--ink); background: rgba(176, 58, 63, 0.1); }
  .cert-attach svg{ width:11px; height:11px; }
  .cert-file-chip{ display:none; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim); margin-top:8px; }
  .cert-file-chip.show{ display:inline-flex; }
  .cert-file-chip a{ text-decoration:underline; text-decoration-color:var(--line); }
  .cert-file-remove{ all:unset; cursor:pointer; color:var(--ink-faint); }
  .cert-file-remove:hover{ color:var(--sanguine-bright); }

  .ref-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:36px; }
  @media (max-width:860px){ .ref-grid{ grid-template-columns:1fr; } }
  .ref-card{ padding-top:26px; border-top:1px solid var(--sanguine); }
  .ref-name{ font-weight:500; font-size:16px; letter-spacing:-0.01em; margin-bottom:4px; min-height:1.4em; }
  .ref-role{ color:var(--ink-dim); font-size:13px; font-weight:300; margin-bottom:12px; min-height:1.4em; }
  .ref-contact{ color:var(--ink-faint); font-size:12.5px; font-weight:300; }
  .ref-contact div{ margin-top:4px; min-height:1.4em; }

  footer{ padding:52px 0 90px; display:flex; justify-content:space-between; align-items:center; color:var(--ink-faint); font-size:12px; font-weight:400; flex-wrap:wrap; gap:16px; letter-spacing: 0.05em; }

  input[type="file"]{
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
    opacity: 0;
    pointer-events: none;
  }

  /* debug panel */
  #debug-panel{
    position:fixed; left:12px; bottom:12px; z-index:9999;
    width:min(560px, calc(100vw - 24px)); max-height:40vh; overflow:auto;
    padding:8px 10px; border-radius:8px; text-align:left;
    background:rgba(8,8,8,0.92); border:1px solid #333; color:#b8f2c0;
    font:11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space:pre-wrap; word-break:break-word;
  }
  #debug-panel[hidden]{ display:none; }
  #debug-panel .err{ color:#ff8a8a; }

  @media print{
    :root{
      --bg:#ffffff; --ink:#141414; --ink-dim:#3a3a3a; --ink-faint:#666666;
      --line:#dcdcdc; --line-soft:#e8e8e8; --sanguine-bright:#7A2027;
      --glass-shadow:none; --glass-border:#dcdcdc; --glass-fill:#ffffff;
    }
    #webgl-bg, .stripes, .rail, .toolbar, .side-stripe, #debug-panel { display:none !important; }
    .glass{ backdrop-filter:none !important; -webkit-backdrop-filter:none !important; box-shadow:none !important; border: 1px solid #dcdcdc !important; }
    .glass::before, .glass::after { display: none !important; }
    main{ padding-left:0; }
    section{ padding:40px 0; }
    .avatar-upload, .cv-upload, .cert-attach{ display:none !important; }
  }

  /* scroll + rail polish */
  .rail{ overflow:visible; }
  .rail button{ position:relative; }
  .rail button::after{ content:""; position:absolute; inset:-8px; border-radius:50%; }
  .rail button:focus-visible{ outline:1px solid var(--sanguine-bright); outline-offset:4px; }
  @media (prefers-reduced-motion:reduce){
    html{ scroll-behavior:auto; }
    *, *::before, *::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="webgl-bg"></canvas>
<div class="stripes"></div>
<div class="side-stripe"></div>

<nav class="rail glass" id="rail">
  <button data-target="hero" class="active" aria-label="Top"></button>
  <button data-target="about" aria-label="About"></button>
  <button data-target="education" aria-label="Education"></button>
  <button data-target="philosophy" aria-label="Philosophy"></button>
  <button data-target="values" aria-label="Values"></button>
  <button data-target="career" aria-label="Career"></button>
  <button data-target="skills" aria-label="Skills"></button>

</nav>

<div class="toolbar glass">

  <button id="btn-debug" type="button">Show debug</button>
  <button id="btn-print">Save as PDF</button>
  <button id="btn-reset">Reset</button>
</div>

<main>
<div class="wrap">
<div id="resume-root">

  <section id="hero">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8.5L21 10.5z"/><path d="M14 3v7h7"/></svg>

  <section id="education">
    <span class="kicker">Educational Background</span>
    <p class="section-hint">List your degrees and training, most recent first.</p>
    <div class="ed-list">
      <div class="ed-item">
        <div class="ed-years" contenteditable="true" data-placeholder="20XX — 20XX"></div>
        <div>
          <div class="ed-degree" contenteditable="true" data-placeholder="Degree / Program name"></div>
          <div class="ed-school" contenteditable="true" data-placeholder="Institution · Department"></div>
        </div>
      </div>
      <div class="ed-item">
        <div class="ed-years" contenteditable="true" data-placeholder="20XX — 20XX"></div>
        <div>
          <div class="ed-degree" contenteditable="true" data-placeholder="Degree / Program name"></div>
          <div class="ed-school" contenteditable="true" data-placeholder="Institution · Department"></div>
        </div>
      </div>
      <div class="ed-item">

      var k = Math.min(1, max / Math.max(im.width, im.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var out = c.toDataURL('image/webp', 0.85);
      if(out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', 0.85);
      done(out);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); done(null); };
    im.src = url;
  }

  root.addEventListener('input', scheduleSave);

  document.addEventListener('change', function(e){
    var input = e.target;
    if(!(input.tagName === 'INPUT' && input.type === 'file')) return;
    var role = input.getAttribute('data-role');
    var file = input.files && input.files[0];
    if(!file){ if(role === 'cv') log('CV picker closed with no file'); return; }

    if(role === 'avatar'){
      var zone = input.closest('.avatar-upload');
      shrinkImage(file, 640, function(dataUrl){
        if(!dataUrl){ setHint('That image could not be read'); return; }
        zone.querySelector('img').src = dataUrl;
        zone.classList.add('has-photo');
        scheduleSave();
      });
    }

    if(role === 'cv'){
      (async function(){
        var stage = 'start';
        try{
          log('File selected: ' + file.name + ' size=' + file.size + ' type=' + file.type);
          var ext = (file.name.indexOf('.') !== -1 ? file.name.split('.').pop() : '').toLowerCase();
          log('Extension detected: ' + ext);

          var bad = '';
          if(ext !== 'pdf') bad = 'only PDF files are allowed (got "' + ext + '")';
          else if(file.size === 0) bad = 'file is empty';
          else if(file.size > 5 * 1024 * 1024) bad = 'file is larger than 5 MB';
          if(bad){
            log('Validation failed: ' + bad);
            setHint('Upload failed — see debug panel');
            showDebug();
            return;
          }
          log('Validation passed');
          setHint('Uploading CV…');

          stage = 'getUser';
          log('Getting user...');
          var u = await sb.auth.getUser();
          if(u.error) throw u.error;
          var userId = u.data && u.data.user ? u.data.user.id : null;
          log('User id: ' + userId);
          if(!userId) throw new Error('No signed-in user');

          stage = 'upload';
          var filePath = userId + '/cv.pdf';
          log('Uploading to cvs/' + filePath);
          var up = await sb.storage.from('cvs').upload(filePath, file, { upsert: true, contentType: 'application/pdf' });
          if(up.error) throw up.error;
          log('Upload result: success');

          stage = 'attach';
          var zone2 = document.getElementById('cv-zone');
          zone2.classList.add('filled');
          var label = zone2.querySelector('#cv-label');
          if(label) label.textContent = file.name;
          var removeBtn = zone2.querySelector('.cv-remove');
          if(removeBtn){ removeBtn.style.display = 'inline'; }
          zone2.setAttribute('data-cv-path', filePath);
          log('data-cv-path set to: ' + filePath + ' — now calling scheduleSave()');
          cvLogPending = true;
          scheduleSave();
          log('scheduleSave() invoked (ready=' + ready + ')');
          setHint('CV uploaded ✓');
        }catch(err){
          log(errLine(err) + ' | stage=' + stage);
          setHint('Upload failed — see debug panel');
          showDebug();
        }finally{
          input.value = ''; // lets the same file be picked again after a failure
        }
      })();
    }

    if(role === 'cert'){
      var item = input.closest('.cert-item');
      var chip = item.querySelector('.cert-file-chip');
      var link = chip.querySelector('a');
      var url = URL.createObjectURL(file);
      link.href = url;
      link.textContent = file.name;
      chip.classList.add('show');
      scheduleSave();
    }
  });

  document.addEventListener('click', function(e){
    if(e.target.classList.contains('cv-remove')){
      e.preventDefault();
      var zone = e.target.closest('.cv-upload');
      zone.classList.remove('filled');
      var label = zone.querySelector('#cv-label');
      if(label) label.textContent = 'Attach CV (PDF)';
      zone.removeAttribute('data-cv-path');
      log('CV removed — data-cv-path cleared');
      e.target.style.display = 'none';
      var inp = document.getElementById('cv-input');
      if(inp) inp.value = '';
      scheduleSave();
    }
    if(e.target.classList.contains('cert-file-remove')){
      var chip = e.target.closest('.cert-file-chip');
      chip.classList.remove('show');
      var a = chip.querySelector('a');
      a.removeAttribute('href');
      a.textContent = '';
      var item = e.target.closest('.cert-item');
      var inp2 = item.querySelector('input[type=file]');
      if(inp2) inp2.value = '';
      scheduleSave();
    }
  });

  /* iOS Safari: open the picker from an explicit tap (a hidden input inside a label is unreliable in srcdoc iframes) */
  var cvZone = document.getElementById('cv-zone');
  var cvInput = document.getElementById('cv-input');
  if(cvZone && cvInput){
    cvZone.addEventListener('click', function(e){
      // Let the remove button handle its own click
      if(e.target.closest('.cv-remove')) return;
      e.preventDefault();
      cvInput.click();
      log('CV picker opened (input.click called)');
    });
    cvZone.addEventListener('keydown', function(e){
      if(e.target.closest('.cv-remove')) return;
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        cvInput.click();
        log('CV picker opened (input.click called)');
      }
    });
  }

  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });

  var resetBtn = document.getElementById('btn-reset'), resetArmed = false, resetTimer = 0;
  function disarmReset(){ resetArmed = false; clearTimeout(resetTimer); resetBtn.textContent = 'Reset'; }
  resetBtn.addEventListener('click', async function(){
    if(!resetArmed){
      resetArmed = true; resetBtn.textContent = 'Click again to confirm';
      setHint('Reset blanks the résumé for everyone');
      resetTimer = setTimeout(function(){ disarmReset(); setHint(ready ? IDLE : hint.textContent); }, 4000);
      return;
    }
    disarmReset();
    clearTimeout(saveTimer);
    var wasReady = ready;
    ready = false; // no autosave while resetting
    setHint('Resetting…');
    try{
      var res = await sb.from(TABLE).upsert({ id: ROW_ID, content: {}, updated_at: new Date().toISOString() });
      if(res.error){ console.warn('[reset]', res.error); ready = wasReady; setHint('Reset failed — see console'); return; }
    }catch(err){
      console.warn('[reset]', err); ready = wasReady; setHint('Reset failed — see console'); return;
    }
    location.reload();
  });

  var rail = document.getElementById('rail');
  var dots = rail.querySelectorAll('button');
  var calmMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var navQueued = false;
  function setActive(){
    navQueued = false;
    /* live query on purpose: the page markup can be replaced after load, which orphans a saved list */
    var secs = document.querySelectorAll('main section[id]');
    if(!secs.length) return;
    var current = secs[0].id;
    var line = window.innerHeight * 0.4;
    for(var i = 0; i < secs.length; i++){
      if(secs[i].getBoundingClientRect().top <= line) current = secs[i].id;
    }
    var de = document.documentElement;
    var scrolls = de.scrollHeight > window.innerHeight + 8;
    if(scrolls && window.innerHeight + window.scrollY >= de.scrollHeight - 4) current = secs[secs.length - 1].id;
    dots.forEach(function(d){
      var on = d.dataset.target === current;
      d.classList.toggle('active', on);
      if(on) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current');
    });
  }
  function queueActive(){ if(navQueued) return; navQueued = true; requestAnimationFrame(setActive); }
  dots.forEach(function(d){
    d.addEventListener('click', function(){
      var target = document.getElementById(d.dataset.target);
      if(target) target.scrollIntoView({ behavior: calmMotion ? 'auto' : 'smooth', block:'start' });
    });
  });
  window.addEventListener('scroll', queueActive, {passive:true});
  window.addEventListener('resize', queueActive);
  setActive();

})();
<\/script>

</body>
</html>
</script>

<script type="text/template" id="tpl-viewer">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résumé — Read Only</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120D0C;

    --glass-fill: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.37), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);

    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;

    color:var(--ink);
    font-family:"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    text-rendering:optimizeLegibility;
    overflow-x: hidden;
  }

  ::selection{ background:var(--sanguine-deep); color:var(--ink); }
  h1,h2,h3{ font-family:inherit; font-weight:500; letter-spacing:-0.03em; margin:0; color:var(--ink); }
  a{ color:inherit; }

  #webgl-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
  }

  .stripes {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(176, 58, 63, 0.03) 40px,
      rgba(176, 58, 63, 0.03) 41px
    );
  }

  .side-stripe {
    position: fixed;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(to bottom, var(--sanguine-deep), var(--sanguine-bright), var(--sanguine-deep));
    z-index: 50;
  }

  .glass{
    position:relative;
    background:var(--glass-fill);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 1;
  }

  .glass::after {
    content: "";
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 40%;
    background: radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 48px; position:relative; }
  @media (max-width:860px){ .wrap{ padding:0 24px; } }

  .rail{
    position:fixed; top:50%; left:22px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:20px 11px; border-radius:999px; z-index:60;
  }
  .rail button{
    all:unset; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.25);
    cursor:pointer; transition:all .3s var(--ease);
  }
  .rail button:hover{ background:var(--ink-dim); transform: scale(1.4); }
  .rail button.active{ background:var(--sanguine-bright); transform:scale(2.2); box-shadow: 0 0 12px var(--sanguine-bright); }
  @media (max-width:860px){ .rail{ display:none; } }

  .toolbar{
    position:fixed; top:24px; right:24px; z-index:60; border-radius:999px;
    display:flex; align-items:center; gap:6px; padding:8px 8px 8px 16px;
  }
  .toolbar span.hint{ font-size:12px; color:var(--ink-dim); margin-right:6px; white-space:nowrap; letter-spacing:0.02em; font-weight: 400; }
  .toolbar button{
    all:unset; cursor:pointer; font-family:inherit; font-weight:500; font-size:12px; color:var(--ink);
    padding:10px 16px; border-radius:999px; background:rgba(255,255,255,0.08); border:1px solid transparent;
    transition:all .2s var(--ease);
  }
  .toolbar button:hover{ background:rgba(176, 58, 63, 0.3); border-color:var(--sanguine-bright); color: #fff; }
  .toolbar button:active{ transform:scale(0.96); }
  @media (max-width:640px){ .toolbar span.hint{ display:none; } }

  main{ padding-left:58px; }
  @media (max-width:860px){ main{ padding-left:0; } }

  section{ padding:120px 0; border-bottom:1px solid var(--line-soft); position: relative; }
  section:last-of-type{ border-bottom:none; }
  @media (max-width:860px){ section{ padding:76px 0; } }

  .kicker{ font-family:inherit; font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); margin-bottom:14px; display:block; }
  .section-hint{ font-size:14px; color:var(--ink-faint); max-width:52ch; margin-bottom:48px; font-weight:300; }

  [data-field]{ border-radius:7px; cursor:default; }
  [data-field]:empty:before{ content:attr(data-placeholder); color:var(--ink-faint); font-style:normal; pointer-events:none; }

  #hero{ min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding:150px 0 100px; }

  .hero-card{ padding:56px clamp(28px,5vw,64px); }

  .hero-card::before {
    padding: 2px;
    background: linear-gradient(135deg, rgba(176,58,63,0.5), rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.1) 60%, rgba(176,58,63,0.3));
  }

  .hero-top{ display:flex; align-items:center; gap:26px; margin-bottom:38px; flex-wrap:wrap; position: relative; z-index: 2; }

  .avatar-upload{
    width:88px; height:88px; border-radius:50%; flex:none; position:relative;
    border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.05);
    overflow:hidden;
  }
  .avatar-upload img{ width:100%; height:100%; object-fit:cover; display:none; }
  .avatar-upload.has-photo img{ display:block; }
  .avatar-upload.has-photo .avatar-plus{ display:none; }
  .avatar-plus{ font-size:10px; font-weight:400; letter-spacing:0.1em; color:var(--ink-faint); text-align:center; line-height:1.3; padding:0 8px; text-transform: uppercase; }

  .eyebrow-line{ display:flex; align-items:center; gap:14px; color:var(--ink-dim); font-size:13px; font-weight:300; letter-spacing: 0.05em; }
  .eyebrow-line .rule{ width:34px; height:1px; background:var(--sanguine); }
  .eyebrow-line [data-field]{ min-width:160px; }

  .hero-name{ font-weight:300; font-size:clamp(48px, 7.5vw, 96px); line-height:0.98; letter-spacing:-0.045em; max-width:900px; position: relative; z-index: 2; }
  .hero-name [data-field]{ display:inline-block; min-width:1ch; }
  .hero-name em{ font-style:normal; color:var(--sanguine-bright); font-weight: 400; }

  .hero-role{ margin-top:24px; font-size:clamp(16px, 1.6vw, 19px); color:var(--ink-dim); max-width:560px; font-weight:300; min-height:1.6em; letter-spacing:-0.01em; position: relative; z-index: 2; }

  .hero-meta{ margin-top:44px; display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--ink-faint); align-items:center; position: relative; z-index: 2; }
  .meta-pill{ padding:9px 14px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--line); min-width:70px; font-weight:400; }

  .cv-upload{
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 12px;
    border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--line);
    font-size:12px; font-weight:400; color:var(--ink-dim);
  }
  .cv-upload svg{ width:14px; height:14px; flex:none; opacity:.85; }
  .cv-upload[data-cv-path]{ cursor:pointer; transition:all .2s ease; }
  .cv-upload[data-cv-path]:hover{ border-color:var(--sanguine-bright); background:rgba(176,58,63,0.15); color:var(--ink); }

  /* debug panel */
  #debug-panel{
    position:fixed; left:12px; bottom:12px; z-index:9999;
    width:min(560px, calc(100vw - 24px)); max-height:40vh; overflow:auto;
    padding:8px 10px; border-radius:8px; text-align:left;
    background:rgba(8,8,8,0.92); border:1px solid #333; color:#b8f2c0;
    font:11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space:pre-wrap; word-break:break-word;
  }
  #debug-panel[hidden]{ display:none; }
  #debug-panel .err{ color:#ff8a8a; }

  .two-col{ display:grid; grid-template-columns:0.85fr 1.15fr; gap:80px; }
  @media (max-width:860px){ .two-col{ grid-template-columns:1fr; gap:32px; } }
  .lede{ font-family:inherit; font-weight:300; font-size:26px; letter-spacing:-0.02em; line-height:1.45; max-width:36ch; min-height:1.6em; }
  .body-copy{ color:var(--ink-dim); font-size:15px; max-width:56ch; font-weight: 300; }
  .body-copy [data-field]{ display:block; min-height:1.6em; }
  .body-copy [data-field] + [data-field]{ margin-top:18px; }

  .ed-list{ display:flex; flex-direction:column; }
  .ed-item{ display:grid; grid-template-columns:150px 1fr; gap:32px; padding:28px 0; border-top:1px solid var(--line-soft); }
  .ed-list .ed-item:last-child{ border-bottom:1px solid var(--line-soft); }
  @media (max-width:640px){ .ed-item{ grid-template-columns:1fr; gap:8px; } }
  .ed-years{ color:var(--sanguine-bright); font-size:11px; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; padding-top:3px; min-height:1.4em; }
  .ed-degree{ font-size:18px; font-weight:500; letter-spacing:-0.01em; margin-bottom:6px; min-height:1.4em; }
  .ed-school{ color:var(--ink-dim); font-size:14px; font-weight:300; min-height:1.4em; }

  .philosophy-quote{
    font-family:inherit; font-weight:300; font-style:normal; font-size:clamp(24px, 2.8vw, 32px);
    letter-spacing:-0.02em; line-height:1.4; max-width:26ch; border-left:1px solid var(--sanguine); padding-left:32px; min-height:1.6em;
  }

  .values-panel{ margin-top:8px; }
  .values-grid{ display:grid; grid-template-columns:repeat(3, 1fr); }
  @media (max-width:860px){ .values-grid{ grid-template-columns:1fr; } }
  .value-card{ padding:38px 32px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); }
  .values-grid .value-card:nth-child(3n){ border-right:none; }
  .values-grid .value-card:nth-last-child(-n+3){ border-bottom:none; }
  @media (max-width:860px){ .value-card { border-right: none !important; } .values-grid .value-card:last-child { border-bottom: none; } }

  .value-mark{ width:30px; height:1px; background:var(--sanguine-bright); margin-bottom:20px; }
  .value-title{ font-weight:500; font-size:17px; letter-spacing:-0.01em; margin-bottom:10px; min-height:1.4em; }
  .value-text{ color:var(--ink-dim); font-size:13.5px; font-weight:300; min-height:1.4em; }

  .timeline{ position:relative; margin-top:10px; }
  .timeline::before{ content:""; position:absolute; left:29px; top:8px; bottom:8px; width:1px; background:linear-gradient(to bottom, transparent, var(--sanguine) 10%, var(--line) 50%, transparent); }
  .tl-item{ position:relative; padding-left:76px; padding-bottom:60px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-node{ position:absolute; left:20px; top:2px; width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .tl-node::after{ content:""; width:7px; height:7px; border-radius:50%; background:var(--sanguine-bright); box-shadow: 0 0 8px var(--sanguine-bright); }
  .tl-period{ color:var(--sanguine-bright); font-weight:500; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; margin-bottom:8px; min-height:1.3em; }
  .tl-role{ font-weight:500; font-size:22px; letter-spacing:-0.02em; margin-bottom:4px; min-height:1.3em; }
  .tl-org{ color:var(--ink-dim); font-size:14px; font-weight:300; margin-bottom:14px; min-height:1.3em; }
  .tl-desc{ color:var(--ink-dim); font-size:14.5px; font-weight:300; max-width:58ch; min-height:1.6em; }

  .skill-groups{ display:grid; grid-template-columns:repeat(2, 1fr); gap:44px 60px; }
  @media (max-width:640px){ .skill-groups{ grid-template-columns:1fr; } }
  .skill-group-title{ font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); margin-bottom:18px; min-height:1.3em; }
  .skill-tags{ display:flex; flex-wrap:wrap; gap:9px; }
  .skill-tag{ padding:8px 14px; font-size:12.5px; font-weight:400; color:var(--ink-dim); border-radius:999px; background:rgba(255,255,255,0.03); border:1px solid var(--line); min-width:56px; }

  .flat-list{ display:flex; flex-direction:column; }
  .flat-item{ display:grid; grid-template-columns:1fr auto; gap:20px; align-items:baseline; padding:22px 0; border-top:1px solid var(--line-soft); }

        dCvZone.setAttribute('tabindex', '0');

        dCvZone.removeAttribute('role');
        dCvZone.removeAttribute('tabindex');
        dCvZone.removeAttribute('title');

    var dChips = root.querySelectorAll('.cert-file-chip');
    var m = Math.min(sChips.length, dChips.length);
    for(var j = 0; j < m; j++){
      var sLink = sChips[j].querySelector('a');
      var dLink = dChips[j].querySelector('a');
      if(!sLink || !dLink) continue;
      dLink.textContent = sLink.textContent || '';
      var href = safeUrl(sLink.getAttribute('href'), false);
      if(href){ dLink.setAttribute('href', href); dLink.setAttribute('rel', 'noopener noreferrer'); }
      else { dLink.removeAttribute('href'); dLink.removeAttribute('rel'); }
      dChips[j].classList.toggle('show', sChips[j].classList.contains('show'));
    }
    setActive(); // content height changed
  }

        showDebug();
        if(tab) try{ tab.close(); }catch(e){}
        return;
      }
      log('Signed URL result: ok');

      if(tab){
        try{ tab.opener = null; }catch(e){}
        tab.location.replace(r.data.signedUrl);
      } else {
        log('Pop-up blocked — allow pop-ups for this site');
        showDebug();
      }
    }catch(err2){
      log('Signed URL error: ' + (err2 && err2.message ? err2.message : String(err2)));
      showDebug();
      if(tab) try{ tab.close(); }catch(e){}
    }
  }
  if(cvZone){
    cvZone.addEventListener('click', function(){ openCv(); });
    cvZone.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCv(); }
    });
  }

  loadFromCloud();
})();

    unameSet('checking');
    try{
      var r = await sb.from('profiles').select('id').eq('username', uname).maybeSingle();
      if(mine !== unameReq || mode !== 'up' || normalizeUsername(email.value) !== uname) return;
      if(r.error){ console.warn('[username check]', r.error); unameSet(''); return; } // never block signup on a failed lookup
      unameChecked = uname;
      unameSet(r.data ? 'taken' : 'available');
    }catch(err){
      console.warn('[username check]', err);
      if(mine === unameReq) unameSet('');
    }
  }
  function scheduleUnameCheck(){
    unameReset();
    if(mode !== 'up') return;
    var uname = normalizeUsername(email.value);
    if(!uname || !validUsername(uname)) return;
    unameTimer = setTimeout(function(){ checkUsername(uname); }, 400);
  }
  email.addEventListener('input', scheduleUnameCheck);

  function friendly(err){
    var m = (err && err.message || '').toLowerCase();
    if(m.indexOf('invalid login') > -1) return 'Wrong username or password.';
    if(m.indexOf('email not confirmed') > -1) return 'Confirm your email first, then sign in.';
    if(m.indexOf('already registered') > -1 || m.indexOf('already been registered') > -1) return 'That username is already taken. Pick another.';
    if(m.indexOf('password') > -1 && m.indexOf('least') > -1) return 'Password must be at least 8 characters.';
    if(m.indexOf('rate limit') > -1 || m.indexOf('too many') > -1) return 'Too many attempts. Wait a minute and try again.';
    if(m.indexOf('fetch') > -1 || m.indexOf('network') > -1) return 'Network error. Check your connection.';
    return (err && err.message) || 'Something went wrong. Try again.';
  }

  function setBusy(b){
    busy = b; go.disabled = b;
    go.textContent = b ? (mode === 'up' ? 'Creating…' : 'Signing in…') : (mode === 'up' ? 'Create account' : 'Sign in');
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if(busy) return;
    var raw = normalizeUsername(email.value), pw = pass.value;
    if(!validUsername(raw)){ say('Username must be 3–24 chars: a–z, 0–9, . _ -', 'err'); email.focus(); return; }
    if(pw.length < 8){ say('Password must be at least 8 characters.', 'err'); pass.focus(); return; }
    if(mode === 'up' && pw !== pass2.value){ say('Passwords do not match.', 'err'); pass2.focus(); return; }
    if(mode === 'up' && unameState === 'taken' && unameChecked === raw){
      say('That username is already taken. Pick another.', 'err'); email.focus(); return;
    }

    setBusy(true); say('');
    try{
      if(mode === 'up'){
        /* last-moment lookup; a failed lookup never blocks signup, the unique index still catches duplicates */
        var c = await sb.from('profiles').select('id').eq('username', raw).maybeSingle();
        if(c.error){ console.warn('[username check]', c.error); }
        else if(c.data){
          unameChecked = raw; unameSet('taken');
          say('That username is already taken. Pick another.', 'err'); return;
        }
        var r = await sb.auth.signUp({ email: usernameToEmail(raw), password: pw });
        if(r.error){ say(friendly(r.error), 'err'); return; }
        if(r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0){
          say('That username is already taken. Pick another.', 'err'); return;
        }
        if(!r.data.session){
          pass.value = ''; pass2.value = '';
          setMode('in'); say('Account created. You can sign in now.', 'ok');
          return;
        }
        /* session exists → onAuthStateChange takes it from here */
      } else {
        var s = await sb.auth.signInWithPassword({ email: usernameToEmail(raw), password: pw });
        if(s.error){ say(friendly(s.error), 'err'); return; }
      }
    }catch(err){
      say(friendly(err), 'err');
    }finally{
      setBusy(false);
    }
  });

  /* ============== ROLE + ROUTING ============== */
  async function fetchRole(user){
    /* Ask the database the same question the security policies ask (public.is_admin),
       so what the page shows and what the backend allows can never disagree. */
    try{
      var a = await sb.rpc('is_admin');
      if(!a.error && typeof a.data === 'boolean') return a.data ? 'admin' : 'viewer';
      if(a.error) console.warn('[is_admin]', a.error);
    }catch(err){ console.warn('[is_admin]', err); }
    try{
      var r = await sb.from('profiles').select('role').eq('id', user.id).maybeSingle();
      if(r.error){ console.warn('[profiles]', r.error); return 'viewer'; }
      return (r.data && r.data.role === 'admin') ? 'admin' : 'viewer';
    }catch(err){ console.warn('[profiles]', err); return 'viewer'; }
  }

  var mountedFor = null;
  async function mount(session){
    if(mountedFor === session.user.id) return;
    mountedFor = session.user.id;
    var role = await fetchRole(session.user);
    $('who').textContent = (session.user.email || '').split('@')[0];
    $('role').textContent = role === 'admin' ? 'Admin' : 'Viewer';
    frame.srcdoc = pageFor(role);
    appEl.hidden = false;
    authEl.classList.add('leaving');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ appEl.classList.add('in'); }); });
    setTimeout(function(){ if(mountedFor !== session.user.id) return; authEl.hidden = true; stopGL(); }, 550); // skip if signed out meanwhile
  }

  function showAuth(){
    mountedFor = null;
    try{ sb.removeAllChannels(); }catch(err){ console.warn(err); } // drop live-update channels from the page being closed
    appEl.classList.remove('in'); appEl.hidden = true;
    frame.removeAttribute('srcdoc'); frame.src = 'about:blank';
    authEl.hidden = false;
    authEl.classList.remove('leaving');
    pass.value = ''; pass2.value = '';
    startGL();
  }

  $('out').addEventListener('click', async function(){
    try{ await sb.auth.signOut(); }catch(err){ console.warn(err); }
    showAuth(); say('Signed out.', 'ok');
  });

  sb.auth.onAuthStateChange(function(event, session){
    if(event === 'SIGNED_OUT'){ if(!appEl.hidden) showAuth(); return; }
    if(session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')){
      setTimeout(function(){ mount(session); }, 0); // avoid awaiting supabase calls inside the auth callback
    }
  });

  (async function init(){
    startGL();
    var r = await sb.auth.getSession();
    if(r.data && r.data.session){ mount(r.data.session); }
    else { authEl.hidden = false; }
  })();
})();
</script>
</body>
</html>
