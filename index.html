<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumé/CV holder</title>
<script>
(function(){try{var d=document.documentElement,s=window.localStorage;
  if(s.getItem('vanilla-theme')==='light') d.setAttribute('data-theme','light');
  if(s.getItem('vanilla-lite')==='1') d.classList.add('lite');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120D0C;
    --line:rgba(255,255,255,0.12);
    --line-soft:rgba(255,255,255,0.06);
    --ink:#F1E9E1;
    --ink-dim:#B9AC9F;
    --ink-faint:#7E7069;
    --sanguine:#7A2027;
    --sanguine-bright:#B03A3F;
    --sanguine-deep:#4E1519;
    --glass-fill: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.37), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
    --radius-lg: 24px;
    --radius-md: 16px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow:hidden;
  }
  ::selection{ background:var(--sanguine-deep); color:var(--ink); }
  [hidden]{ display:none !important; }

  #webgl-bg{ position:fixed; top:0; left:0; width:100%; height:100%; z-index:-2; }
  .stripes{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(176,58,63,0.03) 40px, rgba(176,58,63,0.03) 41px);
  }
  .side-stripe{
    position:fixed; top:0; left:0; width:4px; height:100%; z-index:50;
    background:linear-gradient(to bottom, var(--sanguine-deep), var(--sanguine-bright), var(--sanguine-deep));
  }

  .glass{
    position:relative; background:var(--glass-fill);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
    border-radius:var(--radius-lg); overflow:hidden;
  }
  .glass::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg, rgba(176,58,63,0.5), rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.1) 60%, rgba(176,58,63,0.3));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; z-index:1;
  }
  .glass::after{
    content:""; position:absolute; top:0; left:20%; right:20%; height:40%;
    background:radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 70%);
    pointer-events:none; z-index:1;
  }

  /* ---------- auth ---------- */
  #auth{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  #auth.leaving{ opacity:0; transform:translateY(-8px); pointer-events:none; }
  .card{ width:100%; max-width:420px; padding:44px 40px 36px; position:relative; }
  .card > *{ position:relative; z-index:2; }
  .kicker{ font-weight:500; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sanguine-bright); display:block; margin-bottom:14px; }
  h1{ margin:0; font-weight:300; font-size:44px; line-height:1; letter-spacing:-0.045em; }
  h1 em{ font-style:normal; color:var(--sanguine-bright); font-weight:400; }
  .sub{ margin:14px 0 0; font-size:14px; font-weight:300; color:var(--ink-dim); }

  .tabs{ display:flex; gap:6px; margin:30px 0 22px; padding:5px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--line); position:relative; }
  .tabs button{
    all:unset; flex:1; position:relative; z-index:1; text-align:center; cursor:pointer; padding:9px 0; border-radius:999px;
    font-size:12px; font-weight:500; letter-spacing:0.02em; color:var(--ink-dim); transition:all .25s var(--ease);
  }
  .tabs button:hover{ color:var(--ink); }
  .tabs button.on{ color:#fff; }
  .tabs button:focus-visible{ outline:1px solid var(--sanguine-bright); outline-offset:2px; }

  label.f{ display:block; margin-bottom:16px; }
  label.f span{ display:block; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; font-weight:500; }
  .inp{ position:relative; }
  .inp input{
    width:100%; font:inherit; font-size:15px; font-weight:300; color:var(--ink);
    padding:13px 16px; border-radius:var(--radius-md); background:rgba(255,255,255,0.05);
    border:1px solid var(--line); outline:none; transition:border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .inp input::placeholder{ color:var(--ink-faint); }
  .inp input:focus{ border-color:var(--sanguine-bright); background:rgba(255,255,255,0.07); box-shadow:0 0 0 3px rgba(176,58,63,0.18); }
  .inp input.pw{ padding-right:64px; }
  .inp .eye{
    all:unset; position:absolute; right:8px; top:50%; transform:translateY(-50%); cursor:pointer;
    font-size:11px; font-weight:500; letter-spacing:0.06em; color:var(--ink-faint); padding:6px 10px; border-radius:999px; transition:color .2s var(--ease);
  }
  .inp .eye:hover{ color:var(--ink); }

  .msg{ min-height:20px; margin:2px 0 14px; font-size:13px; font-weight:400; color:var(--ink-faint); }
  .msg.err{ color:#E4797D; }
  .msg.ok{ color:var(--ink-dim); }
  .msg.uname{ margin:6px 0 0; min-height:20px; font-size:12px; }
  .msg.uname.checking{ animation:unamepulse 1.1s var(--ease) infinite; }
  @keyframes unamepulse{ 50%{ opacity:.45; } }
  @media (prefers-reduced-motion:reduce){ .msg.uname.checking{ animation:none; } }

  .go{
    all:unset; box-sizing:border-box; width:100%; text-align:center; cursor:pointer; font-weight:500; font-size:14px; letter-spacing:0.02em; color:#fff;
    padding:14px 18px; border-radius:999px; background:rgba(176,58,63,0.3); border:1px solid var(--sanguine-bright); transition:all .2s var(--ease);
  }
  .go:hover{ background:rgba(176,58,63,0.5); }
  .go:active{ transform:scale(0.98); }
  .go:disabled{ opacity:.55; cursor:default; transform:none; }
  .go:focus-visible{ outline:1px solid #fff; outline-offset:3px; }
  .foot{ margin:22px 0 0; font-size:12px; font-weight:300; color:var(--ink-faint); text-align:center; }

  /* ---------- app ---------- */
  #app{ position:fixed; inset:0; opacity:0; transition:opacity .6s var(--ease); }
  #app.in{ opacity:1; }
  #app iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  .account{
    position:fixed; right:24px; bottom:24px; z-index:200; border-radius:999px;
    display:flex; align-items:center; gap:10px; padding:8px 8px 8px 18px;
  }
  .account > *{ position:relative; z-index:2; }
  .account .who{ font-size:12px; color:var(--ink-dim); letter-spacing:0.02em; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account .role{
    font-size:10px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase; color:var(--sanguine-bright);
  }
  .account button{
    all:unset; cursor:pointer; font-weight:500; font-size:12px; color:var(--ink); padding:10px 16px; border-radius:999px;
    background:rgba(255,255,255,0.08); border:1px solid transparent; transition:all .2s var(--ease);
  }
  .account button:hover{ background:rgba(176,58,63,0.3); border-color:var(--sanguine-bright); color:#fff; }
  .account button:active{ transform:scale(0.96); }
  @media (max-width:640px){ .account .who{ display:none; } .account{ right:16px; bottom:16px; } .card{ padding:36px 26px 30px; } h1{ font-size:38px; } }
  @media print{ .account{ display:none !important; } }

  /* ---------- theme + lower-end device mode ---------- */
  :root{
    --lite-top:#170F0E; --lite-bot:#0E0A09;
    --lite-glow1:rgba(176,58,63,0.34); --lite-glow2:rgba(122,32,39,0.32);
    --lite-edge:rgba(176,58,63,0.16); --lite-sheen:rgba(255,255,255,0.07);
    --lite-card:rgba(26,18,17,0.80);
  }
  html[data-theme="light"]{
    --bg:#F4ECE4;
    --line:rgba(78,21,25,0.14);
    --line-soft:rgba(78,21,25,0.07);
    --ink:#2B1B19;
    --ink-dim:#5C4A45;
    --ink-faint:#75655E;
    --sanguine-bright:#A33339;
    --glass-fill:rgba(255,255,255,0.55);
    --glass-border:rgba(122,32,39,0.16);
    --glass-shadow:0 8px 32px rgba(78,21,25,0.14), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(78,21,25,0.06);
    --lite-top:#F8F2EC; --lite-bot:#EFE5DB;
    --lite-glow1:rgba(176,58,63,0.22); --lite-glow2:rgba(122,32,39,0.15);
    --lite-edge:rgba(163,51,57,0.10); --lite-sheen:rgba(255,255,255,0.85);
    --lite-card:rgba(255,255,255,0.80);
  }
  body{ transition:background-color .35s var(--ease), color .35s var(--ease); }
  .glass{ transition:background-color .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease); }

  html[data-theme="light"] ::selection{ background:rgba(176,58,63,0.25); }
  html[data-theme="light"] .glass::before{
    background:linear-gradient(135deg, rgba(163,51,57,0.45), rgba(122,32,39,0.08) 40%, rgba(122,32,39,0.08) 60%, rgba(163,51,57,0.3));
  }
  html[data-theme="light"] .glass::after{ background:radial-gradient(ellipse at center top, rgba(255,255,255,0.7), transparent 70%); }
  html[data-theme="light"] .tabs{ background:rgba(78,21,25,0.05); }
  html[data-theme="light"] .tabs button.on{ color:var(--sanguine); }
  html[data-theme="light"] .tabs .pill{ background:rgba(176,58,63,0.14); }
  html[data-theme="light"] .inp input{ background:rgba(255,255,255,0.6); }
  html[data-theme="light"] .inp input:focus{ background:rgba(255,255,255,0.92); box-shadow:0 0 0 3px rgba(163,51,57,0.16); }
  html[data-theme="light"] .msg.err{ color:#B3262E; }
  html[data-theme="light"] .go{ background:rgba(163,51,57,0.92); color:#fff; }
  html[data-theme="light"] .go:hover{ background:var(--sanguine); }
  html[data-theme="light"] .go:focus-visible{ outline-color:var(--sanguine); }
  html[data-theme="light"] .account button{ background:rgba(78,21,25,0.06); }
  html[data-theme="light"] .account button:hover{ background:rgba(176,58,63,0.16); color:var(--ink); }

  /* top-right controls */
  .card > .tools{ position:absolute; top:18px; right:18px; z-index:5; display:flex; gap:8px; }
  .tool{
    all:unset; box-sizing:border-box; position:relative; display:grid; place-items:center; width:34px; height:34px; cursor:pointer;
    border-radius:999px; color:var(--ink-dim); background:rgba(255,255,255,0.06); border:1px solid var(--line);
    transition:color .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
  }
  html[data-theme="light"] .tool{ background:rgba(78,21,25,0.05); }
  .tool:hover{ color:var(--ink); border-color:var(--sanguine-bright); }
  .tool:active{ transform:scale(0.94); }
  .tool:focus-visible{ outline:1px solid var(--sanguine-bright); outline-offset:2px; }
  .tool[aria-pressed="true"]{ background:rgba(176,58,63,0.3); border-color:var(--sanguine-bright); color:#fff; }
  html[data-theme="light"] .tool[aria-pressed="true"]{ background:rgba(176,58,63,0.16); color:var(--sanguine); }
  .tool::after{
    content:attr(data-tip); position:absolute; top:calc(100% + 8px); right:0; white-space:nowrap; pointer-events:none;
    font-size:11px; font-weight:500; letter-spacing:0.02em; color:var(--ink); padding:6px 10px; border-radius:999px;
    background:var(--bg); border:1px solid var(--line); opacity:0; transform:translateY(-3px);
    transition:opacity .18s var(--ease), transform .18s var(--ease);
  }
  .tool:focus-visible::after{ opacity:1; transform:none; }
  @media (hover:hover){ .tool:hover::after{ opacity:1; transform:none; } }

  /* CSS-drawn icons */
  .ic{ position:relative; display:block; width:18px; height:18px; }
  .ic i{ position:absolute; inset:0; display:block; transition:opacity .3s var(--ease), transform .4s var(--ease); }
  .ic-sun::before{ content:""; position:absolute; inset:5px; border-radius:50%; background:currentColor; }
  .ic-sun::after{
    content:""; position:absolute; inset:0;
    background:repeating-conic-gradient(from -7deg, currentColor 0 14deg, transparent 14deg 45deg);
    -webkit-mask:radial-gradient(circle, transparent 6.5px, #000 7px, #000 9px, transparent 9.5px);
            mask:radial-gradient(circle, transparent 6.5px, #000 7px, #000 9px, transparent 9.5px);
  }
  .ic-moon::before{ content:""; position:absolute; inset:2px; border-radius:50%; box-shadow:inset -5px -3px 0 0 currentColor; transform:rotate(-20deg); }
  html:not([data-theme="light"]) .ic-moon{ opacity:0; transform:rotate(-70deg) scale(.5); }
  html[data-theme="light"] .ic-sun{ opacity:0; transform:rotate(70deg) scale(.5); }
  .ic .ic-bolt{ inset:1px; background:currentColor; clip-path:polygon(60% 0%, 18% 56%, 46% 56%, 38% 100%, 82% 42%, 54% 42%); }

  /* lower-end device mode: no WebGL, no backdrop blur, static glossy side panels */
  #lite-bg{ position:fixed; inset:0; z-index:-2; display:none; pointer-events:none; overflow:hidden;
    background:
      radial-gradient(55% 70% at 0% 35%, var(--lite-glow1), transparent 70%),
      radial-gradient(50% 65% at 100% 70%, var(--lite-glow2), transparent 70%),
      linear-gradient(180deg, var(--lite-top), var(--lite-bot));
  }
  #lite-bg::before, #lite-bg::after{
    content:""; position:absolute; top:-10%; bottom:-10%; width:clamp(90px, 22vw, 320px);
  }
  #lite-bg::before{
    left:0;
    -webkit-mask-image:linear-gradient(to right, #000 35%, transparent);
            mask-image:linear-gradient(to right, #000 35%, transparent);
    background:
      linear-gradient(105deg, transparent 8%, var(--lite-sheen) 26%, transparent 46%),
      linear-gradient(to right, var(--lite-edge), transparent);
  }
  #lite-bg::after{
    right:0;
    -webkit-mask-image:linear-gradient(to left, #000 35%, transparent);
            mask-image:linear-gradient(to left, #000 35%, transparent);
    background:
      linear-gradient(255deg, transparent 8%, var(--lite-sheen) 26%, transparent 46%),
      linear-gradient(to left, var(--lite-edge), transparent);
  }
  html.lite #lite-bg{ display:block; }
  html.lite #webgl-bg, html.lite .stripes{ display:none; }
  html.lite .glass{ -webkit-backdrop-filter:none; backdrop-filter:none; background:var(--lite-card); }
  @media (prefers-reduced-motion:reduce){ .ic i, .tool, .tool::after{ transition:none; } }
  /* ---------- motion ---------- */
  .tabs .pill{
    position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 16px) / 2); border-radius:999px; pointer-events:none;
    background:rgba(176,58,63,0.3); box-shadow:inset 0 0 0 1px var(--sanguine-bright);
    transition:transform .55s cubic-bezier(.34,1.32,.64,1), background-color .35s var(--ease);
  }
  .tabs.up .pill{ transform:translateX(calc(100% + 6px)); }
  .tabs button{ transition:color .3s var(--ease); }

  .reveal{
    display:grid; grid-template-rows:0fr; opacity:0; visibility:hidden;
    transition:grid-template-rows .5s var(--ease), opacity .25s var(--ease), visibility 0s linear .5s;
  }
  .reveal.open{
    grid-template-rows:1fr; opacity:1; visibility:visible;
    transition:grid-template-rows .5s var(--ease), opacity .4s var(--ease) .1s, visibility 0s;
  }
  .reveal > div{ min-height:0; overflow:hidden; padding:4px; margin:-4px; }

  @keyframes rise{ from{ opacity:0; transform:translateY(12px); } }
  .card{ animation:rise .7s var(--ease) both; }
  .card > :not(.tools){ animation:rise .6s var(--ease) both; }
  .card > :nth-child(2){ animation-delay:.10s; }
  .card > :nth-child(3){ animation-delay:.16s; }
  .card > :nth-child(4){ animation-delay:.22s; }
  .card > :nth-child(5){ animation-delay:.28s; }
  .card > :nth-child(6){ animation-delay:.34s; }
  .card > :nth-child(7){ animation-delay:.40s; }
  @media (prefers-reduced-motion:reduce){
    .card, .card > :not(.tools){ animation:none; }
    .tabs .pill, .tabs button, .reveal, .reveal.open{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="webgl-bg"></canvas>
<div id="lite-bg"></div>
<div class="stripes"></div>
<div class="side-stripe"></div>

<section id="auth" hidden>
  <div class="card glass">
    <div class="tools">
      <button type="button" class="tool" id="theme-toggle" data-tip="Switch to light mode" aria-label="Switch to light mode">
        <span class="ic"><i class="ic-sun"></i><i class="ic-moon"></i></span>
      </button>
      <button type="button" class="tool" id="lite-toggle" data-tip="Lower-end device mode: Off" aria-label="Lower-end device mode" aria-pressed="false">
        <span class="ic"><i class="ic-bolt"></i></span>
      </button>
    </div>
    <span class="kicker">Résumé</span>
    <h1>Resumé/CV <em>holder</em></h1>
    <p class="sub" id="sub">Sign in to continue.</p>

    <div class="tabs" role="tablist">
      <span class="pill" aria-hidden="true"></span>
      <button type="button" role="tab" id="tab-in" class="on" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-up" aria-selected="false">Create account</button>
    </div>

    <form id="form" novalidate>
      <label class="f"><span>Username</span>
        <div class="inp"><input id="email" type="text" autocomplete="username" placeholder="yourname" required></div>
        <div class="reveal" id="uname-reveal"><div><div class="msg uname" id="uname-status" role="status" aria-live="polite"></div></div></div>
      </label>
      <label class="f"><span>Password</span>
        <div class="inp"><input id="pass" class="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="eye" id="eye" aria-label="Show password">Show</button></div>
      </label>
      <div class="reveal" id="confirm-reveal"><div>
        <label class="f" id="confirm-wrap"><span>Confirm password</span>
          <div class="inp"><input id="pass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>
        </label>
      </div></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button class="go" id="go" type="submit">Sign in</button>
    </form>
    <p class="foot" id="foot">New here? Create an account to view the résumé.</p>
  </div>
</section>

<div id="app" hidden>
  <iframe id="frame" title="Résumé"></iframe>
  <div class="account glass">
    <span class="who" id="who"></span>
    <span class="role" id="role"></span>
    <button type="button" id="out">Sign out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  var canvas = document.getElementById('webgl-bg');
  var gl = null, glTried = false;
  var raf = 0, glRunning = false;
  var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  var drawFrame = null;

  function initGL(){
    if(glTried) return;
    glTried = true;
    gl = canvas.getContext('webgl');
    if(!gl) return;
    var resize = function(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
    };
    window.addEventListener('resize', resize);
    resize();

    var vsSource = `
      attribute vec2 a_position;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    var fsSource = `
      precision highp float;
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;
      uniform float u_light;

      float random(vec2 st) {
        return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
      }

      float noise(vec2 st) {
        vec2 i = floor(st);
        vec2 f = fract(st);
        float a = random(i);
        float b = random(i + vec2(1.0, 0.0));
        float c = random(i + vec2(0.0, 1.0));
        float d = random(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }

      float fbm(vec2 st) {
        float value = 0.0;
        float amplitude = 0.5;
        for (int i = 0; i < 5; i++) {
          value += amplitude * noise(st);
          st *= 2.0;
          amplitude *= 0.5;
        }
        return value;
      }

      void main() {
        vec2 st = gl_FragCoord.xy / u_resolution.xy;
        st.x *= u_resolution.x / u_resolution.y;

        vec2 mouse = u_mouse / u_resolution;
        mouse.x *= u_resolution.x / u_resolution.y;

        float t = u_time * 0.03;

        vec2 dist = st - mouse;
        float mouseInfluence = exp(-dot(dist, dist) * 3.0) * 0.5;

        vec2 q = vec2(fbm(st + t), fbm(st - t + vec2(5.2, 1.3)));
        vec2 r = vec2(fbm(st + 4.0*q + vec2(1.7,9.2) + t*1.5), fbm(st + 4.0*q + vec2(8.3,2.8) - t*1.5));
        float f = fbm(st + 4.0*r + mouseInfluence);

        vec3 color1 = mix(vec3(0.07, 0.05, 0.04), vec3(0.96, 0.93, 0.90), u_light);
        vec3 color2 = mix(vec3(0.30, 0.08, 0.10), vec3(0.90, 0.76, 0.74), u_light);
        vec3 color3 = mix(vec3(0.69, 0.22, 0.25), vec3(0.74, 0.34, 0.36), u_light);

        vec3 color = mix(color1, color2, f);
        color = mix(color, color3, smoothstep(0.4, 0.8, f) * smoothstep(0.0, 0.5, length(q)));

        color += vec3(0.15, 0.05, 0.05) * mouseInfluence * (1.0 - 0.6 * u_light);

        float vignette = smoothstep(1.5, 0.2, distance(st, vec2(0.5, 0.5)));
        vec3 darkMix  = color * (0.4 + vignette * 0.6);
        vec3 lightMix = mix(color, vec3(0.91, 0.85, 0.80), (1.0 - vignette) * 0.55);
        color = mix(darkMix, lightMix, u_light);

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    var compileShader = function(type, source){
      var s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      return s;
    };
    var program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    var uRes = gl.getUniformLocation(program, 'u_resolution');
    var uTime = gl.getUniformLocation(program, 'u_time');
    var uMouse = gl.getUniformLocation(program, 'u_mouse');
    var uLight = gl.getUniformLocation(program, 'u_light');
    var t0 = performance.now();

    window.addEventListener('mousemove', function(e){ mouseX = e.clientX; mouseY = window.innerHeight - e.clientY; });

    drawFrame = function(){
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, (performance.now() - t0) / 1000);
      gl.uniform2f(uMouse, mouseX, mouseY);
      lightNow += (lightTarget - lightNow) * 0.08;
      gl.uniform1f(uLight, lightNow);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      if(glRunning) raf = requestAnimationFrame(drawFrame);
    };
  }
  if(!lite) initGL();
  function startGL(){ if(lite) return; initGL(); if(drawFrame && !glRunning){ glRunning = true; drawFrame(); } }
  function stopGL(){ glRunning = false; cancelAnimationFrame(raf); }

  /* ============== ELEMENTS ============== */
  var $ = function(id){ return document.getElementById(id); };
  var authEl = $('auth'), appEl = $('app'), frame = $('frame');
  var tabIn = $('tab-in'), tabUp = $('tab-up'), form = $('form');
  var email = $('email'), pass = $('pass'), pass2 = $('pass2'), confirmReveal = $('confirm-reveal');
  var cardEl = document.querySelector('.card'), tabsEl = document.querySelector('.tabs');
  var calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var EASE = 'cubic-bezier(.22,.61,.36,1)';
  function swap(el, dy){
    if(calm || !el.animate) return;
    el.animate([{ opacity:0, transform:'translateY(' + dy + 'px)' }, { opacity:1, transform:'translateY(0)' }], { duration:340, easing:EASE });
  }
  var msg = $('msg'), go = $('go'), sub = $('sub'), foot = $('foot'), eye = $('eye');
  var mode = 'in', busy = false;
  var unameReveal = $('uname-reveal'), unameEl = $('uname-status');
  var unameTimer = 0, unameReq = 0, unameState = '', unameChecked = '';

  /* ============== THEME + LOWER-END DEVICE CONTROLS ============== */
  var themeBtn = $('theme-toggle'), liteBtn = $('lite-toggle');
  function syncThemeUI(){
    var light = lightTarget === 1;
    var tip = light ? 'Switch to dark mode' : 'Switch to light mode';
    themeBtn.setAttribute('aria-label', tip); themeBtn.setAttribute('data-tip', tip);
  }
  function syncLiteUI(){
    liteBtn.setAttribute('aria-pressed', String(lite));
    liteBtn.setAttribute('data-tip', 'Lower-end device mode: ' + (lite ? 'On' : 'Off'));
  }
  themeBtn.addEventListener('click', function(){
    var light = lightTarget === 0;
    lightTarget = light ? 1 : 0;
    if(!glRunning) lightNow = lightTarget;
    if(light) root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
    remember('vanilla-theme', light ? 'light' : 'dark');
    syncThemeUI();
  });
  liteBtn.addEventListener('click', function(){
    lite = !lite;
    root.classList.toggle('lite', lite);
    remember('vanilla-lite', lite ? '1' : '0');
    if(lite) stopGL(); else startGL();
    syncLiteUI();
  });
  syncThemeUI(); syncLiteUI();

  function say(text, kind){
    msg.textContent = text || ''; msg.className = 'msg' + (kind ? ' ' + kind : '');
    if(!text || calm || !msg.animate) return;
    msg.animate([{ opacity:0, transform:'translateY(-4px)' }, { opacity:1, transform:'translateY(0)' }], { duration:260, easing:EASE });
    if(kind === 'err') cardEl.animate([{ transform:'translateX(0)' }, { transform:'translateX(-7px)' }, { transform:'translateX(6px)' }, { transform:'translateX(-3px)' }, { transform:'translateX(0)' }], { duration:380, easing:'ease-out' });
  }

  function setMode(m){
    var changed = m !== mode;
    mode = m;
    var up = m === 'up';
    tabIn.classList.toggle('on', !up); tabUp.classList.toggle('on', up);
    tabIn.setAttribute('aria-selected', String(!up)); tabUp.setAttribute('aria-selected', String(up));
    tabsEl.classList.toggle('up', up); confirmReveal.classList.toggle('open', up); unameReveal.classList.toggle('open', up);
    pass.autocomplete = up ? 'new-password' : 'current-password';
    go.textContent = up ? 'Create account' : 'Sign in';
    sub.textContent = up ? 'Create an account to view the résumé.' : 'Sign in to continue.';
    foot.textContent = up ? 'Already registered? Switch to Sign in.' : 'New here? Create an account to view the résumé.';
    if(changed){ swap(sub, 6); swap(foot, 6); swap(go, 0); }
    say('');
    if(up) scheduleUnameCheck(); else unameReset();
  }
  tabIn.addEventListener('click', function(){ setMode('in'); });
  tabUp.addEventListener('click', function(){ setMode('up'); });
  eye.addEventListener('click', function(){
    var show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    pass2.type = pass.type;
    eye.textContent = show ? 'Hide' : 'Show';
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  /* ============== USERNAME HELPERS ============== */
  var LOCAL_DOMAIN = '@local.resume';
  function normalizeUsername(u){ return (u || '').trim().toLowerCase(); }
  function usernameToEmail(u){ return normalizeUsername(u) + LOCAL_DOMAIN; }
  function validUsername(u){
    return /^[a-z0-9._-]{3,24}$/.test(normalizeUsername(u));
  }

  /* ============== USERNAME AVAILABILITY (create account tab) ============== */
  var UNAME_TEXT = { checking:'Checking…', available:'✓ available', taken:'✗ already taken' };
  var UNAME_CLASS = { checking:' checking', available:' ok', taken:' err' };
  function unameSet(state){
    unameState = state;
    unameEl.textContent = state ? UNAME_TEXT[state] : '';
    unameEl.className = 'msg uname' + (state ? UNAME_CLASS[state] : '');
  }
  function unameReset(){
    clearTimeout(unameTimer); unameReq++; // bumping the id drops any lookup still in flight
    unameChecked = ''; unameSet('');
  }
  async function checkUsername(uname){
    var mine = ++unameReq;
    unameSet('checking');
    try{
      var r = await sb.from('profiles').select('id').eq('username', uname).maybeSingle();
      if(mine !== unameReq || mode !== 'up' || normalizeUsername(email.value) !== uname) return;
      if(r.error){ console.warn('[username check]', r.error); unameSet(''); return; } // never block signup on a failed lookup
      unameChecked = uname;
      unameSet(r.data ? 'taken' : 'available');
    }catch(err){
      console.warn('[username check]', err);
      if(mine === unameReq) unameSet('');
    }
  }
  function scheduleUnameCheck(){
    unameReset();
    if(mode !== 'up') return;
    var uname = normalizeUsername(email.value);
    if(!uname || !validUsername(uname)) return;
    unameTimer = setTimeout(function(){ checkUsername(uname); }, 400);
  }
  email.addEventListener('input', scheduleUnameCheck);

  function friendly(err){
    var m = (err && err.message || '').toLowerCase();
    if(m.indexOf('invalid login') > -1) return 'Wrong username or password.';
    if(m.indexOf('email not confirmed') > -1) return 'Confirm your email first, then sign in.';
    if(m.indexOf('already registered') > -1 || m.indexOf('already been registered') > -1) return 'That username is already taken. Pick another.';
    if(m.indexOf('password') > -1 && m.indexOf('least') > -1) return 'Password must be at least 8 characters.';
    if(m.indexOf('rate limit') > -1 || m.indexOf('too many') > -1) return 'Too many attempts. Wait a minute and try again.';
    if(m.indexOf('fetch') > -1 || m.indexOf('network') > -1) return 'Network error. Check your connection.';
    return (err && err.message) || 'Something went wrong. Try again.';
  }

  function setBusy(b){
    busy = b; go.disabled = b;
    go.textContent = b ? (mode === 'up' ? 'Creating…' : 'Signing in…') : (mode === 'up' ? 'Create account' : 'Sign in');
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if(busy) return;
    var raw = normalizeUsername(email.value), pw = pass.value;
    if(!validUsername(raw)){ say('Username must be 3–24 chars: a–z, 0–9, . _ -', 'err'); email.focus(); return; }
    if(pw.length < 8){ say('Password must be at least 8 characters.', 'err'); pass.focus(); return; }
    if(mode === 'up' && pw !== pass2.value){ say('Passwords do not match.', 'err'); pass2.focus(); return; }
    if(mode === 'up' && unameState === 'taken' && unameChecked === raw){
      say('That username is already taken. Pick another.', 'err'); email.focus(); return;
    }

    setBusy(true); say('');
    try{
      if(mode === 'up'){
        /* last-moment lookup; a failed lookup never blocks signup, the unique index still catches duplicates */
        var c = await sb.from('profiles').select('id').eq('username', raw).maybeSingle();
        if(c.error){ console.warn('[username check]', c.error); }
        else if(c.data){
          unameChecked = raw; unameSet('taken');
          say('That username is already taken. Pick another.', 'err'); return;
        }
        var r = await sb.auth.signUp({ email: usernameToEmail(raw), password: pw });
        if(r.error){ say(friendly(r.error), 'err'); return; }
        if(r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0){
          say('That username is already taken. Pick another.', 'err'); return;
        }
        if(!r.data.session){
          pass.value = ''; pass2.value = '';
          setMode('in'); say('Account created. You can sign in now.', 'ok');
          return;
        }
        /* session exists → onAuthStateChange takes it from here */
      } else {
        var s = await sb.auth.signInWithPassword({ email: usernameToEmail(raw), password: pw });
        if(s.error){ say(friendly(s.error), 'err'); return; }
      }
    }catch(err){
      say(friendly(err), 'err');
    }finally{
      setBusy(false);
    }
  });

  /* ============== ROLE + ROUTING ============== */
  async function fetchRole(user){
    /* Ask the database the same question the security policies ask (public.is_admin),
       so what the page shows and what the backend allows can never disagree. */
    try{
      var a = await sb.rpc('is_admin');
      if(!a.error && typeof a.data === 'boolean') return a.data ? 'admin' : 'viewer';
      if(a.error) console.warn('[is_admin]', a.error);
    }catch(err){ console.warn('[is_admin]', err); }
    try{
      var r = await sb.from('profiles').select('role').eq('id', user.id).maybeSingle();
      if(r.error){ console.warn('[profiles]', r.error); return 'viewer'; }
      return (r.data && r.data.role === 'admin') ? 'admin' : 'viewer';
    }catch(err){ console.warn('[profiles]', err); return 'viewer'; }
  }

  var mountedFor = null;
  async function mount(session){
    if(mountedFor === session.user.id) return;
    mountedFor = session.user.id;
    var role = await fetchRole(session.user);
    $('who').textContent = (session.user.email || '').split('@')[0];
    $('role').textContent = role === 'admin' ? 'Admin' : 'Viewer';
    frame.srcdoc = decode(role === 'admin' ? PAGE_ADMIN : PAGE_VIEWER);
    appEl.hidden = false;
    authEl.classList.add('leaving');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ appEl.classList.add('in'); }); });
    setTimeout(function(){ if(mountedFor !== session.user.id) return; authEl.hidden = true; stopGL(); }, 550); // skip if signed out meanwhile
  }

  function showAuth(){
    mountedFor = null;
    try{ sb.removeAllChannels(); }catch(err){ console.warn(err); } // drop live-update channels from the page being closed
    appEl.classList.remove('in'); appEl.hidden = true;
    frame.removeAttribute('srcdoc'); frame.src = 'about:blank';
    authEl.hidden = false;
    authEl.classList.remove('leaving');
    pass.value = ''; pass2.value = '';
    startGL();
  }

  $('out').addEventListener('click', async function(){
    try{ await sb.auth.signOut(); }catch(err){ console.warn(err); }
    showAuth(); say('Signed out.', 'ok');
  });

  sb.auth.onAuthStateChange(function(event, session){
    if(event === 'SIGNED_OUT'){ if(!appEl.hidden) showAuth(); return; }
    if(session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')){
      setTimeout(function(){ mount(session); }, 0); // avoid awaiting supabase calls inside the auth callback
    }
  });

  (async function init(){
    startGL();
    var r = await sb.auth.getSession();
    if(r.data && r.data.session){ mount(r.data.session); }
    else { authEl.hidden = false; }
  })();
})();
</script>
</body>
</html>
